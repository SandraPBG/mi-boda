<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Interactivo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: "Times New Roman", Times, serif;
            background-color: #fdfbf7;
            overflow-x: hidden;
        }

        /* =================================
           PANTALLA COMPLETA DEL SOBRE
        ================================= */

        .pantalla-sobre {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            z-index: 100;

            perspective: 1500px;

            transition:
                opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                filter 1s cubic-bezier(0.4, 0, 0.2, 1);

            pointer-events: none;
            isolation: isolate;
        }

        /* Sombra suave en los bordes de toda la pantalla */

        .pantalla-sobre::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 8;
            pointer-events: none;

            box-shadow:
                inset 0 0 45px rgba(20, 28, 13, 0.16),
                inset 0 0 120px rgba(20, 28, 13, 0.08);
        }

        /* =================================
           BASE Y TEXTURA DEL PAPEL
        ================================= */

        .cara-triangulo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            background-color: #548235;
            background-image: url("sobre1.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            pointer-events: none;

            box-shadow:
                inset 0 0 60px rgba(30, 40, 20, 0.12);
        }

        /* =================================
           SOLAPA SUPERIOR
        ================================= */

        .triangulo-superior {
            clip-path: polygon(0 0, 100% 0, 50% 50%);
            transform-origin: top center;

            z-index: 4;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(238, 242, 218, 0.12),
                    rgba(41, 57, 27, 0.12)
                ),
                url("sobre1.png");

            background-position: center;
            background-size: cover;

            filter: drop-shadow(
                0 7px 9px rgba(26, 36, 17, 0.25)
            );

            transition:
                transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Línea sutil del doblez superior */

        .triangulo-superior::after {
            content: "";
            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: 2px;

            background: rgba(241, 239, 215, 0.32);
            box-shadow:
                0 2px 5px rgba(30, 40, 20, 0.12);
        }

        /* =================================
           SOLAPA INFERIOR
        ================================= */

        .triangulo-inferior {
            clip-path: polygon(0 100%, 100% 100%, 50% 50%);
            z-index: 3;

            background-image:
                linear-gradient(
                    to top,
                    rgba(28, 43, 17, 0.22),
                    rgba(230, 236, 210, 0.05)
                ),
                url("sobre1.png");

            background-position: center;
            background-size: cover;
        }

        /* =================================
           SOLAPA IZQUIERDA
        ================================= */

        .triangulo-izquierdo {
            clip-path: polygon(0 0, 0 100%, 50% 50%);
            z-index: 2;

            background-image:
                linear-gradient(
                    to right,
                    rgba(224, 232, 202, 0.08),
                    rgba(35, 51, 23, 0.18)
                ),
                url("sobre1.png");

            background-position: center;
            background-size: cover;
        }

        /* =================================
           SOLAPA DERECHA
        ================================= */

        .triangulo-derecho {
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
            z-index: 2;

            background-image:
                linear-gradient(
                    to left,
                    rgba(224, 232, 202, 0.06),
                    rgba(35, 51, 23, 0.16)
                ),
                url("sobre1.png");

            background-position: center;
            background-size: cover;
        }

        /* =================================
           RELIEVE DEL CENTRO DEL SOBRE
        ================================= */

        .triangulo-inferior::before {
            content: "";
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    transparent 48.8%,
                    rgba(35, 48, 23, 0.18) 49.7%,
                    rgba(241, 240, 217, 0.18) 50%,
                    transparent 51%
                );

            pointer-events: none;
        }

        /* =================================
           SELLO DE CERA
        ================================= */

        .boton-sello {
            position: absolute;

            top: 50%;
            left: 50%;

            width: clamp(90px, 12vw, 145px);
            aspect-ratio: 1 / 1;

            transform: translate(-50%, -50%);

            background-color: #607D3B;
            background-image: url("sello.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

            border-radius: 50%;

            cursor: pointer;
            z-index: 10;
            pointer-events: auto;

            border: 1px solid rgba(235, 226, 195, 0.7);

            box-shadow:
                0 8px 16px rgba(24, 34, 15, 0.32),
                0 3px 5px rgba(24, 34, 15, 0.22),
                inset 0 2px 4px rgba(255, 255, 255, 0.3),
                inset 0 -5px 8px rgba(30, 43, 18, 0.22);

            transition:
                opacity 0.5s ease,
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        /* Brillo superior del sello */

        .boton-sello::before {
            content: "";
            position: absolute;

            top: 9%;
            left: 17%;

            width: 38%;
            height: 17%;

            border-radius: 50%;
            transform: rotate(-30deg);

            background: rgba(255, 255, 230, 0.22);
            filter: blur(3px);

            pointer-events: none;
        }

        .boton-sello:hover {
            transform: translate(-50%, -50%) scale(1.05);

            box-shadow:
                0 11px 21px rgba(24, 34, 15, 0.36),
                0 3px 5px rgba(24, 34, 15, 0.22),
                inset 0 2px 4px rgba(255, 255, 255, 0.3),
                inset 0 -5px 8px rgba(30, 43, 18, 0.22);
        }

        .boton-sello:focus-visible {
            outline: 2px solid #f2ead2;
            outline-offset: 5px;
        }

        /* =================================
           ANIMACIÓN DE APERTURA
        ================================= */

        .pantalla-sobre.abrir-solapa .triangulo-superior {
            transform: rotateX(120deg);
        }

        .pantalla-sobre.abrir-solapa .boton-sello {
            opacity: 0;
            pointer-events: none;

            transform: translate(-50%, -50%) scale(0.8);
        }

        .pantalla-sobre.difuminar {
            opacity: 0;
            filter: blur(20px);
        }

        /* =================================
           CONTENIDO DE LA PÁGINA
        ================================= */

        .seccion-contenido {
            min-height: 100vh;
            padding: 40px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .contenido-wrapper {
            max-width: 700px;
            line-height: 1.7;
        }

        .seccion-contenido h1 {
            color: #548235;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .seccion-contenido p {
            color: #C46224;
        }

        /* =================================
           ADAPTACIÓN A CELULARES
        ================================= */

        @media (max-width: 768px) {
            .boton-sello {
                width: clamp(85px, 19vw, 110px);
            }

            .pantalla-sobre::after {
                box-shadow:
                    inset 0 0 25px rgba(20, 28, 13, 0.14);
            }

            .seccion-contenido h1 {
                font-size: 2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pantalla-sobre,
            .triangulo-superior,
            .boton-sello {
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>




</body>
</html>
